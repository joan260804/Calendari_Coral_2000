*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea,select{font:inherit}
.hidden{display:none!important}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:linear-gradient(rgba(15,20,35,.45),rgba(15,20,35,.45)),var(--foto) center/cover no-repeat}
.card{width:100%;max-width:340px;padding:28px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px}
.card h1{margin:0 0 8px;font-size:24px;line-height:1.2}
.card p{margin:0 0 14px;color:var(--mute)}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mute)}
.btn{padding:9px 14px;border:0;border-radius:6px;background:var(--blue);color:#fff;cursor:pointer}
.btn.sec{background:#e9ecf3;color:var(--ink)}
.btn.del{background:var(--redbg);color:var(--red)}
.btn.red{background:var(--red);color:#fff;padding:11px 30px}
#err{color:var(--red);min-height:20px;margin:8px 0 0!important;font-size:13px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .sp{flex:1}
header b{font-size:17px}
.who{font-size:17px;font-weight:600}
.banner{height:170px;background:var(--foto) center 35%/cover no-repeat}
#nav{display:flex;align-items:center;gap:8px;padding:12px 14px}
#nav h2{margin:0;flex:1;text-align:center;font-size:30px;font-weight:700;text-transform:capitalize}
#grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);margin:0 8px 20px;border:1px solid var(--line)}
.dh{background:var(--card);text-align:center;padding:7px 0;font-size:14px;font-weight:600;color:var(--mute)}
.d{background:var(--card);min-height:104px;padding:3px;cursor:pointer;overflow:hidden}
.d.out{background:#fafbfc;color:#a9afbd}
.n{font-size:19px;font-weight:700;display:inline-block;min-width:32px;height:32px;line-height:32px;text-align:center;border-radius:50%}
.d.today .n{background:var(--blue);color:#fff}
.d.hol .n,.d.sun .n{color:var(--red)}
.d.today.hol .n{color:#fff;background:var(--red)}
.hn{display:block;font-size:10.5px;color:var(--red);background:var(--redbg);border-radius:3px;padding:0 3px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d.has{background:#cdeedb}
.d.has.out{background:#e6f6ec}
.ev{display:block;font-size:11px;background:#2e9e5b;color:#fff;border-radius:3px;padding:0 3px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--mute)}
#modal{position:fixed;inset:0;background:var(--card);display:flex;align-items:stretch;overflow:auto;-webkit-overflow-scrolling:touch}
.box{background:var(--card);width:100%;min-height:100%;padding:24px max(18px,calc((100% - 720px)/2)) 40px}
.box h3{margin:0 0 14px;font-size:26px}
.box input,.box textarea,.box select{font-size:17px;padding:12px}
.box label{font-size:15px}
.item{border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:8px;padding:16px 18px;margin:12px 0;font-size:18px}
.item b{font-size:22px}
.item.h{border-left-color:var(--red);background:var(--redbg)}
.item small{color:var(--mute);display:block;font-size:15px;margin-top:2px}
.item a{color:var(--blue)}
.row{display:flex;gap:8px}.row>div{flex:1}
.acts{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.acts .btn{padding:13px 22px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;margin:0;padding:5px 9px;border:1px solid var(--line);border-radius:16px;color:var(--ink);font-size:13px}
.chip input{width:auto;margin:0}
@media(max-width:560px){.d{min-height:86px}.ev,.hn{font-size:9.5px}.banner{height:110px}}

/* ===== Lletra molt gran: s'adapta a l'amplada de la pantalla ===== */
:root{--ink:#0b0f18;--mute:#3a4150;--blue:#1f5fd0;--red:#b3201c}
body{font-size:clamp(22px,5.6vw,30px);line-height:1.4}
#login{padding:0;align-items:flex-start}
.card{max-width:none;width:100%;min-height:100%;border-radius:0;padding:7vw 6vw;display:flex;flex-direction:column;justify-content:center}
.card h1{font-size:clamp(40px,11vw,60px);margin-bottom:5vw}
.card p{font-size:clamp(24px,6.2vw,34px);color:#2a3140}
input,textarea,select{font-size:clamp(28px,7vw,38px);padding:.55em .6em;border:3px solid #6f788c}
.btn{font-size:clamp(24px,6vw,32px);padding:.7em 1em;border-radius:12px}
#enter,#verify,#back{font-size:clamp(32px,8.4vw,44px);padding:.8em 1em;margin-top:5vw!important}
#err{font-size:clamp(24px,6vw,32px);font-weight:700;min-height:1.4em}
@media(min-width:760px){#login{align-items:center}.card{max-width:680px;min-height:0;border-radius:16px;padding:40px}}
header b{font-size:clamp(22px,5.4vw,32px)}
.who{font-size:clamp(28px,7vw,40px);font-weight:700}
.banner{height:clamp(120px,32vw,240px)}
#nav .btn{min-width:clamp(72px,17vw,104px);height:clamp(72px,17vw,104px);font-size:clamp(40px,10vw,60px);padding:0;line-height:1}
#nav h2{font-size:clamp(40px,10.5vw,64px);font-weight:700}
#grid{margin:0 4px 24px}
.dh{font-size:clamp(20px,5vw,28px);padding:10px 0;font-weight:700}
.d{min-height:clamp(84px,17vw,140px);padding:4px 2px;text-align:center}
.n{font-size:clamp(28px,7.6vw,46px);font-weight:700;min-width:1.7em;height:1.7em;line-height:1.7em}
.d.hol{background:#fbd4d1}
.d.has,.d.has.out{background:#b9e6cb}
.hn,.ev,.more{display:none}
@media(min-width:760px){.d{text-align:left}.ev,.hn{display:block;font-size:17px;padding:2px 6px}.more{display:block;font-size:17px}}
#legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 6px 20px}
.lg{padding:.5em .8em;border-radius:12px;font-weight:700;font-size:clamp(22px,5.4vw,30px)}
.lg.g{background:#b9e6cb}.lg.r{background:#fbd4d1;color:#b3201c}.lg.b{background:#1f5fd0;color:#fff}
#lt{font-size:clamp(34px,8.4vw,46px);margin:10px 6px 8px}
#list{margin:0 6px 32px}
.li{display:flex;gap:.6em;align-items:baseline;padding:.6em .7em;border:3px solid #6f788c;border-radius:14px;margin:14px 0;font-size:clamp(26px,6.8vw,38px);cursor:pointer;background:#fff;line-height:1.25}
.li b{min-width:1.8em;font-size:1.2em}
.li.hol{background:#fbd4d1;border-color:#b3201c;color:#7d1411}
.box h3{font-size:clamp(38px,9.4vw,52px)}
.item{font-size:clamp(26px,6.8vw,36px);padding:.7em .8em;margin:16px 0}
.item b{font-size:1.2em}
.item small{font-size:.8em}
.acts .btn{font-size:clamp(26px,6.8vw,36px);padding:.7em 1.1em}
.box input,.box textarea,.box select{font-size:clamp(26px,6.8vw,36px)}
.box label{font-size:clamp(24px,6vw,32px);margin-top:20px}
.chip{font-size:clamp(24px,6vw,30px);padding:.4em .8em;border-radius:30px}
input[type=checkbox]{width:42px!important;height:42px;padding:0}
.btn.red{font-size:clamp(32px,8vw,46px);padding:.7em 1.6em}
.btn.yel{background:#f5c400;color:#1d2433;font-weight:700}
#forgot{font-size:clamp(22px,5.4vw,28px);padding:.6em .8em;margin-top:14px!important}
#okmsg{color:#14703a;font-weight:700;font-size:clamp(22px,5.6vw,30px);margin:12px 0 0}
#bye{position:fixed;inset:0;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vw;z-index:50}
#bye h1{font-size:clamp(40px,11vw,64px);margin:0 0 16px}
#bye p{font-size:clamp(26px,6.6vw,36px);margin:0 0 36px}
#bye .btn{background:#fff;color:var(--blue);font-weight:700}
#title .tap{cursor:pointer;border-bottom:4px dotted var(--blue);padding:0 .08em}
#title .tap::after{content:' ▾';font-size:.55em;color:var(--blue)}
.pkg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.pk{font:inherit;font-size:clamp(28px,7.4vw,38px);font-weight:700;padding:.7em .3em;border-radius:14px;border:3px solid #6f788c;background:#fff;color:var(--ink);cursor:pointer;text-transform:capitalize}
.pk.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pw{position:relative}
.pw input{padding-right:clamp(64px,16vw,86px)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:clamp(52px,13vw,72px);height:clamp(52px,13vw,72px);border:0;border-radius:12px;background:transparent;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.eye svg{width:72%;height:72%}
</style>
</head>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCEMlMtUXIHF4u7PI3lQnpWswQXDPMvwrw",
  authDomain: "calendari-coral-2000.firebaseapp.com",
  projectId: "calendari-coral-2000",
  storageBucket: "calendari-coral-2000.firebasestorage.app",
  messagingSenderId: "651611797227",
  appId: "1:651611797227:web:bb49672ad63e335096b0ae"
});
const db = firebase.firestore(), auth = firebase.auth();
auth.languageCode = 'ca';
const FV = firebase.firestore.FieldValue;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const DAYS = ['dilluns','dimarts','dimecres','dijous','divendres','dissabte','diumenge'];
const ORD = ['1r','2n','3r','4t','5è'];

let me = null, events = [], cur = new Date(), unsub = null, pend = null;
cur.setDate(1);

// ---------- Dates ----------
const dn = k => { const [a, b, c] = k.split('-'); return Math.round(Date.UTC(a, b - 1, c) / 864e5); };
const fromDn = n => { const t = new Date(n * 864e5); return key(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
const wd = k => (new Date(dn(k) * 864e5).getUTCDay() + 6) % 7; // 0 = dilluns
const fmtD = k => { const [y, m, d] = k.split('-'); const mn = MONTHS[m - 1]; return `${+d} ${/^[aeiou]/.test(mn) ? "d'" : 'de '}${mn} de ${y}`; };

// ---------- Festius de Catalunya ----------
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
    m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31),
    da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
const holCache = {};
// Calendari oficial de festes laborals de Catalunya (Ordre EMT/66/2025 per al 2026 i Ordre EMT/52/2026 per al 2027)
const HOL_OF = {
  2026: [[1,1,"Cap d'Any"],[1,6,'Reis'],[4,3,'Divendres Sant'],[4,6,'Dilluns de Pasqua'],[5,1,'Dia del Treball'],[6,24,'Sant Joan'],[8,15,"L'Assumpció"],[9,11,'Diada'],[10,12,'Festa Nacional'],[12,8,'Immaculada'],[12,25,'Nadal'],[12,26,'Sant Esteve']],
  2027: [[1,1,"Cap d'Any"],[1,6,'Reis'],[3,26,'Divendres Sant'],[3,29,'Dilluns de Pasqua'],[5,1,'Dia del Treball'],[6,24,'Sant Joan'],[9,11,'Diada'],[10,12,'Festa Nacional'],[11,1,'Tots Sants'],[12,6,'Constitució'],[12,8,'Immaculada'],[12,25,'Nadal']]
};
// Festes locals de Terrassa (cal actualitzar-les cada any quan es publiquin; 2027 pendent)
const HOL_TERRASSA = {
  2025: [[4,17,'Dijous Sant (Terrassa)'],[7,7,'Festa Major (Terrassa)']],
  2026: [[4,2,'Dijous Sant (Terrassa)'],[7,6,'Festa Major (Terrassa)']]
};
function holidays(y) {
  if (holCache[y]) return holCache[y];
  const h = {}, add = (m, d, n) => h[key(y, m - 1, d)] = n;
  if (HOL_OF[y]) HOL_OF[y].forEach(([m, d, n]) => add(m, d, n));
  else {
    add(1,1,"Cap d'Any"); add(1,6,'Reis'); add(5,1,'Dia del Treball'); add(6,24,'Sant Joan'); add(8,15,"L'Assumpció"); add(9,11,'Diada');
    add(10,12,'Festa Nacional'); add(11,1,'Tots Sants'); add(12,6,'Constitució'); add(12,8,'Immaculada'); add(12,25,'Nadal'); add(12,26,'Sant Esteve');
    const e = easter(y), at = n => { const t = new Date(e); t.setDate(e.getDate() + n); return key(t.getFullYear(), t.getMonth(), t.getDate()); };
    h[at(-2)] = 'Divendres Sant'; h[at(1)] = 'Dilluns de Pasqua';
  }
  (HOL_TERRASSA[y] || []).forEach(([m, d, n]) => add(m, d, n));
  return holCache[y] = h;
}

// ---------- Repetició d'events ----------
function isStart(e, s) {
  const r = e.rep;
  if (!r) return s === e.ini;
  if (s < e.ini || (e.ex || []).includes(s)) return false;
  if (holidays(+s.slice(0, 4))[s]) return false; // les repeticions no cauen en dies festius
  if (r.fin && r.fin.fecha && s > r.fin.fecha) return false;
  const n = r.n || 1, a = dn(e.ini), b = dn(s);
  if (r.f === 'd') return (b - a) % n === 0;
  if (r.f === 'w') {
    const dias = r.dias && r.dias.length ? r.dias : [wd(e.ini)];
    return dias.includes(wd(s)) && ((b - wd(s)) - (a - wd(e.ini))) / 7 % n === 0;
  }
  const [y1, m1, d1] = e.ini.split('-').map(Number), [y2, m2, d2] = s.split('-').map(Number);
  if (r.f === 'm') {
    if (((y2 - y1) * 12 + m2 - m1) % n) return false;
    return r.mes === 'sem' ? wd(s) === wd(e.ini) && Math.ceil(d2 / 7) === Math.ceil(d1 / 7) : d2 === d1;
  }
  if (r.f === 'y') return m1 === m2 && d1 === d2 && (y2 - y1) % n === 0;
  return false;
}
function endOfCount(ini, rep, veces) {
  let c = 0;
  for (let i = 0; i < 365 * 30; i++) {
    const s = fromDn(dn(ini) + i);
    if (isStart({ ini, rep: { ...rep, fin: null }, ex: [] }, s) && ++c === veces) return s;
  }
  return fromDn(dn(ini) + 365 * 30);
}
function evsOf(k) {
  const out = [];
  for (const e of events) {
    const dur = dn(e.fi) - dn(e.ini);
    for (let i = 0; i <= dur; i++) {
      const s = fromDn(dn(k) - i);
      if (isStart(e, s)) { out.push({ ...e, ini: s, fi: fromDn(dn(s) + dur) }); break; }
    }
  }
  return out.sort((a, b) => (a.hIni || '').localeCompare(b.hIni || ''));
}

// ---------- Login (telèfon; els editors, a més, contrasenya) ----------
const normTel = s => s.replace(/\D/g, '').slice(-9);
const setErr = t => $('err').textContent = t || '';
const EM = tel => tel + '@coral2000.invalid';
const authUser = () => new Promise(r => { const u = auth.onAuthStateChanged(x => { u(); r(x); }); });
async function login(raw, silent) {
  const tel = normTel(raw);
  if (tel.length < 9) return silent || setErr('Escriu un telèfon de 9 xifres.');
  setErr('');
  try {
    const doc = await db.collection('usuarios').doc(tel).get();
    if (!doc.exists) { if (!silent) setErr('Aquest número no està autoritzat.'); return; }
    const u = doc.data();
    if (u.rol !== 'editor') { if (auth.currentUser) await auth.signOut(); return enter(tel, u); }
    const cu = await authUser();
    const em = u.email || EM(tel);
    if (cu && (cu.email || '').toLowerCase() === em.toLowerCase()) return enter(tel, u);
    if (silent) return;
    pend = { tel, u, em };
    $('s1').classList.add('hidden'); $('s2').classList.remove('hidden'); $('pwd').value = ''; resetEye(); $('pwd').focus();
  } catch (e) { if (!silent) setErr('Error de connexió.'); }
}
function enter(tel, u) {
  me = { tel, nom: u.nombre || tel, edit: u.rol === 'editor' };
  localStorage.setItem('cg_tel', tel);
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = me.nom;
  unsub = db.collection('eventos').onSnapshot(s => {
    events = s.docs.map(d => ({ id: d.id, ...d.data() })); render();
  }, () => alert('No es poden carregar els events. Revisa la connexió.'));
  render();
}
$('enter').addEventListener('click', () => login($('tel').value));
$('tel').addEventListener('keydown', e => { if (e.key === 'Enter') login($('tel').value); });
$('verify').addEventListener('click', async () => {
  try { await auth.signInWithEmailAndPassword(pend.em, $('pwd').value); enter(pend.tel, pend.u); }
  catch (e) { setErr(e.code === 'auth/too-many-requests' ? 'Massa intents. Torna-ho a provar més tard.' : 'Contrasenya incorrecta.'); }
});
$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') $('verify').click(); });
$('back').addEventListener('click', () => { $('s2').classList.add('hidden'); $('s1').classList.remove('hidden'); setErr(''); $('okmsg').textContent = ''; resetEye(); });
$('forgot').addEventListener('click', async () => {
  setErr(''); $('okmsg').textContent = '';
  const em = pend && pend.u.email;
  if (!em) return setErr("Aquest editor no té cap correu configurat. Contacta amb l'administrador.");
  try {
    await auth.sendPasswordResetEmail(em);
    $('okmsg').textContent = `T'hem enviat un correu a ${em.replace(/^(.).*(@.*)$/, '$1***$2')} amb un enllaç per crear una contrasenya nova. Mira també la carpeta de correu brossa.`;
  } catch (e) {
    setErr(e.code === 'auth/user-not-found' ? "No hi ha cap compte d'editor amb aquest correu. Contacta amb l'administrador."
      : e.code === 'auth/too-many-requests' ? 'Massa intents. Torna-ho a provar més tard.' : "No s'ha pogut enviar el correu. Torna-ho a provar.");
  }
});
$('out').addEventListener('click', async () => {
  localStorage.removeItem('cg_tel'); unsub && unsub(); try { await auth.signOut(); } catch (_) {}
  $('modal').classList.add('hidden'); $('app').classList.add('hidden'); $('bye').classList.remove('hidden');
  try { window.close(); } catch (_) {}
});
$('again').addEventListener('click', () => location.reload());
if (localStorage.getItem('cg_tel')) login(localStorage.getItem('cg_tel'), true);

// ---------- Calendari ----------
function render() {
  const y = cur.getFullYear(), m = cur.getMonth();
  $('tm').textContent = MONTHS[m]; $('ty').textContent = y;
  const first = (new Date(y, m, 1).getDay() + 6) % 7, start = new Date(y, m, 1 - first);
  const today = new Date(), tk = key(today.getFullYear(), today.getMonth(), today.getDate());
  let html = ['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].map(d => `<div class="dh">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const t = new Date(start); t.setDate(start.getDate() + i);
    if (i >= 35 && t.getMonth() !== m) break;
    const k = key(t.getFullYear(), t.getMonth(), t.getDate()), h = holidays(t.getFullYear())[k], ev = evsOf(k);
    html += `<div class="d${t.getMonth() !== m ? ' out' : ''}${k === tk ? ' today' : ''}${ev.length ? ' has' : ''}${h ? ' hol' : ''}${t.getDay() === 0 ? ' sun' : ''}" data-k="${k}">
      <span class="n">${t.getDate()}</span>${h ? `<span class="hn">${esc(h)}</span>` : ''}
      ${ev.slice(0, 3).map(e => `<span class="ev">${esc(e.titulo)}</span>`).join('')}
      ${ev.length > 3 ? `<span class="more">+${ev.length - 3} més</span>` : ''}</div>`;
  }
  $('grid').innerHTML = html;
}
$('grid').addEventListener('click', e => { const d = e.target.closest('.d'); if (d) openDay(d.dataset.k); });
$('prev').addEventListener('click', () => { cur.setMonth(cur.getMonth() - 1); render(); });
$('next').addEventListener('click', () => { cur.setMonth(cur.getMonth() + 1); render(); });

// ---------- Modal ----------
const show = h => { $('box').innerHTML = h; $('modal').classList.remove('hidden'); };
const close = () => $('modal').classList.add('hidden');
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') close(); });

function openDay(k) {
  const h = holidays(+k.slice(0, 4))[k], ev = evsOf(k);
  show(`<h3>${fmtD(k)}</h3>
    ${h ? `<div class="item h"><b>${esc(h)}</b><small>Festiu</small></div>` : ''}
    ${ev.map(e => {
      const hora = e.dia ? 'Tot el dia' : `${e.ini === e.fi ? '' : fmtD(e.ini) + ' '}${e.hIni || ''} – ${e.ini === e.fi ? '' : fmtD(e.fi) + ' '}${e.hFi || ''}`;
      return `<div class="item"><b>${esc(e.titulo)}</b><small>${hora}</small>
        ${me.edit && e.rep ? '<small>🔁 Esdeveniment repetit</small>' : ''}
        ${e.coment ? `<div style="margin-top:4px">💬 ${esc(e.coment)}</div>` : ''}
        ${/^https?:\/\//i.test(e.lugar || '') ? `<div style="margin-top:6px"><b>On?</b> <a href="${esc(e.lugar)}" target="_blank" rel="noopener">📍 Veure ubicació</a></div>` : ''}
        ${me.edit ? `<small>Creat per ${esc(e.autor || '')}</small>` : ''}
        ${me.edit ? `<div class="acts"><button class="btn sec" data-ed="${e.id}" data-occ="${e.ini}">Editar</button><button class="btn del" data-del="${e.id}" data-occ="${e.ini}">Esborrar</button></div>` : ''}</div>`;
    }).join('') || (h ? '' : '<p style="color:var(--mute)">No hi ha events aquest dia.</p>')}
    <div class="acts"><button class="btn sec" id="x">Tancar</button>${me.edit ? `<button class="btn" id="add">Nou event</button>` : ''}</div>`);
  $('x').addEventListener('click', close);
  if (!me.edit) return;
  $('add').addEventListener('click', () => form(k));
  $('box').querySelectorAll('[data-ed]').forEach(b => b.addEventListener('click', () => {
    const m = events.find(e => e.id === b.dataset.ed), occ = b.dataset.occ;
    if (!m.rep) return form(k, m);
    askScope('Editar', k, mode => mode === 'one' ? form(k, { ...m, ini: occ, fi: fromDn(dn(occ) + dn(m.fi) - dn(m.ini)), rep: null }, { one: true, mid: m.id, occ }) : form(k, m));
  }));
  $('box').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    const m = events.find(e => e.id === b.dataset.del), occ = b.dataset.occ;
    if (!m.rep) { if (confirm('Vols esborrar aquest event?')) { await db.collection('eventos').doc(m.id).delete(); openDay(k); } return; }
    askScope('Esborrar', k, async mode => {
      const ref = db.collection('eventos').doc(m.id), prev = fromDn(dn(occ) - 1);
      try {
        if (mode === 'one') await ref.update({ ex: FV.arrayUnion(occ) });
        else if (mode === 'next' && prev >= m.ini) await ref.update({ 'rep.fin': { t: 'fecha', fecha: prev } });
        else await ref.delete();
      } catch (e) { alert("No s'ha pogut esborrar. Torna a iniciar sessió i prova-ho de nou."); }
      openDay(k);
    }, true);
  }));
}

function askScope(verb, k, cb, withNext) {
  show(`<h3>${verb} esdeveniment repetit</h3>
    <div class="acts" style="flex-direction:column;align-items:stretch">
      <button class="btn" id="sc1">Només aquest esdeveniment</button>
      ${withNext ? '<button class="btn" id="scn">Aquest i els següents</button>' : ''}
      <button class="btn" id="sc2">Tots els esdeveniments</button>
      <button class="btn sec" id="sc0">Cancel·lar</button></div>`);
  $('sc1').addEventListener('click', () => cb('one'));
  if (withNext) $('scn').addEventListener('click', () => cb('next'));
  $('sc2').addEventListener('click', () => cb('all'));
  $('sc0').addEventListener('click', () => openDay(k));
}

function form(k, e, opt) {
  opt = opt || {};
  e = e || { titulo: '', coment: '', lugar: '', ini: k, fi: k, hIni: '09:00', hFi: '10:00', dia: false, rep: null };
  const r = e.rep || { f: '', n: 1, dias: [], mes: 'dia', fin: { t: 'nunca' } };
  const nth = Math.ceil(+e.ini.slice(8) / 7), w0 = wd(e.ini);
  show(`<h3>${opt.one ? 'Editar aquest esdeveniment' : e.id ? 'Editar event' : 'Nou event'}</h3>
    <label>Títol *</label><input id="f-t" value="${esc(e.titulo)}">
    <label>Comentari (màxim 128 caràcters) <span id="cc" style="float:right"></span></label><textarea id="f-c" rows="2" maxlength="128">${esc(e.coment)}</textarea>
    <label>Ubicació (enllaç de Google Maps)</label><input id="f-l" type="url" placeholder="https://maps.app.goo.gl/..." value="${esc(e.lugar)}">
    <div class="row"><div><label>Data inici</label><input id="f-i" type="date" value="${e.ini}"></div><div><label>Hora inici</label><input id="f-hi" type="time" value="${e.hIni}"></div></div>
    <div class="row"><div><label>Data fi</label><input id="f-f" type="date" value="${e.fi}"></div><div><label>Hora fi</label><input id="f-hf" type="time" value="${e.hFi}"></div></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="f-a" type="checkbox" style="width:auto" ${e.dia ? 'checked' : ''}> Tot el dia</label>
    <div id="r-sec" ${opt.one ? 'class="hidden"' : ''}>
      <label>Repetició</label>
      <select id="r-f">
        <option value="">No es repeteix</option><option value="d">Cada dia</option><option value="w">Cada setmana</option>
        <option value="m">Cada mes</option><option value="y">Cada any</option></select>
      <div id="r-box" class="hidden">
        <p style="color:var(--mute);font-size:.8em;margin:10px 0 0">Els dies festius (Catalunya i Terrassa) s'ometen automàticament.</p>
        <div class="row" style="align-items:end"><div><label>Repeteix cada</label><input id="r-n" type="number" min="1" max="99" value="${r.n || 1}"></div><div id="r-u" style="padding-bottom:9px"></div></div>
        <div id="r-w" class="chips">${['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].map((d, i) => `<label class="chip"><input type="checkbox" value="${i}" ${(r.dias && r.dias.length ? r.dias : [w0]).includes(i) ? 'checked' : ''}>${d}</label>`).join('')}</div>
        <select id="r-m" style="margin-top:8px"><option value="dia">El dia ${+e.ini.slice(8)} de cada mes</option><option value="sem">El ${ORD[nth - 1]} ${DAYS[w0]} de cada mes</option></select>
        <label>Acaba</label>
        <select id="r-e"><option value="nunca">Mai</option><option value="fecha">El dia</option><option value="veces">Després de</option></select>
        <input id="r-ef" type="date" value="${(r.fin && r.fin.fecha && r.fin.t === 'fecha') ? r.fin.fecha : ''}" style="margin-top:8px">
        <input id="r-ev" type="number" min="1" max="500" value="${(r.fin && r.fin.veces) || 10}" style="margin-top:8px">
      </div></div>
    <p id="err2" style="color:var(--red);margin:8px 0 0"></p>
    <div class="acts"><button class="btn sec" id="c">Cancel·lar</button><button class="btn" id="s">Desar</button></div>`);
  $('r-f').value = r.f || ''; $('r-m').value = r.mes || 'dia'; $('r-e').value = (r.fin && r.fin.t) || 'nunca';
  const allday = () => { const on = $('f-a').checked; if (on) { $('f-hi').value = '00:00'; $('f-hf').value = '23:59'; } $('f-hi').disabled = $('f-hf').disabled = on; };
  const rui = () => {
    const f = $('r-f').value, en = $('r-e').value;
    $('r-box').classList.toggle('hidden', !f);
    $('r-u').textContent = { d: 'dia(es)', w: 'setmana(es)', m: 'mes(os)', y: 'any(s)' }[f] || '';
    $('r-w').classList.toggle('hidden', f !== 'w'); $('r-m').classList.toggle('hidden', f !== 'm');
    $('r-ef').classList.toggle('hidden', en !== 'fecha'); $('r-ev').classList.toggle('hidden', en !== 'veces');
  };
  const cnt = () => $('cc').textContent = `${$('f-c').value.length}/128`;
  $('f-c').addEventListener('input', cnt); cnt();
  $('f-a').addEventListener('change', allday); allday();
  $('r-f').addEventListener('change', rui); $('r-e').addEventListener('change', rui); rui();
  $('c').addEventListener('click', () => openDay(k));
  $('s').addEventListener('click', async () => {
    const d = { titulo: $('f-t').value.trim(), coment: $('f-c').value.trim().slice(0, 128), lugar: $('f-l').value.trim(),
      ini: $('f-i').value, fi: $('f-f').value, hIni: $('f-hi').value, hFi: $('f-hf').value, dia: $('f-a').checked, rep: null };
    let bad = !d.titulo ? 'El títol és obligatori.' : !d.ini || !d.fi ? 'Indica les dates.'
      : (d.fi + d.hFi) < (d.ini + d.hIni) ? "La fi no pot ser abans de l'inici."
      : d.lugar && !/^https?:\/\//i.test(d.lugar) ? 'La ubicació ha de ser un enllaç que comenci per http.' : '';
    const f = opt.one ? '' : $('r-f').value;
    if (!bad && f) {
      const rep = { f, n: Math.max(1, +$('r-n').value || 1) }, t = $('r-e').value;
      if (f === 'w') rep.dias = [...$('r-w').querySelectorAll('input:checked')].map(i => +i.value);
      if (f === 'm') rep.mes = $('r-m').value;
      rep.fin = { t };
      if (t === 'fecha') { rep.fin.fecha = $('r-ef').value; if (!rep.fin.fecha || rep.fin.fecha < d.ini) bad = 'La data final de la repetició no és vàlida.'; }
      if (t === 'veces') { rep.fin.veces = Math.max(1, +$('r-ev').value || 1); rep.fin.fecha = endOfCount(d.ini, rep, rep.fin.veces); }
      d.rep = rep;
    }
    if (bad) return $('err2').textContent = bad;
    try {
      if (opt.one) {
        await db.collection('eventos').doc(opt.mid).update({ ex: FV.arrayUnion(opt.occ) });
        await db.collection('eventos').add({ ...d, ex: [], autor: me.nom, autorTel: me.tel });
      } else if (e.id) await db.collection('eventos').doc(e.id).update(d);
      else await db.collection('eventos').add({ ...d, ex: [], autor: me.nom, autorTel: me.tel });
      openDay(d.ini);
    } catch (err) { $('err2').textContent = "No s'ha pogut desar. Torna a iniciar sessió i prova-ho de nou."; }
  });
}

// ---------- Selector de mes i any ----------
const pickList = (title, items, sel, attr, onPick) => {
  show(`<h3>${title}</h3><div class="pkg">${items.map(([v, n]) => `<button class="pk${v === sel ? ' on' : ''}" data-v="${v}">${n}</button>`).join('')}</div>
    <div class="acts"><button class="btn sec" id="pcx">Cancel·lar</button></div>`);
  $('box').querySelectorAll('.pk').forEach(b => b.addEventListener('click', () => { onPick(+b.dataset.v); render(); close(); }));
  $('pcx').addEventListener('click', close);
};
const openMonths = () => pickList('Tria el mes', MONTHS.map((n, i) => [i, n]), cur.getMonth(), 'm', v => cur.setMonth(v));
const openYears = () => {
  const y0 = new Date().getFullYear() - 1, a = Math.min(y0, cur.getFullYear()), z = Math.max(y0 + 11, cur.getFullYear()), ys = [];
  for (let y = a; y <= z; y++) ys.push([y, String(y)]);
  pickList("Tria l'any", ys, cur.getFullYear(), 'y', v => cur.setFullYear(v));
};
['tm', 'ty'].forEach((id, i) => {
  const el = $(id), fn = i ? openYears : openMonths;
  el.addEventListener('click', fn);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
});

// ---------- Ull per veure la contrasenya ----------
const EYE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.5"/></svg>`, EYE_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.5"/><path d="M3 3l18 18"/></svg>`;
$('eye').addEventListener('click', () => {
  const on = $('pwd').type === 'password';
  $('pwd').type = on ? 'text' : 'password';
  $('eye').innerHTML = on ? EYE_OFF : EYE;
  $('eye').setAttribute('aria-pressed', String(on));
  $('eye').setAttribute('aria-label', on ? 'Amagar la contrasenya' : 'Mostrar la contrasenya');
  $('pwd').focus();
});
const resetEye = () => { $('pwd').type = 'password'; $('eye').innerHTML = EYE; $('eye').setAttribute('aria-pressed', 'false'); $('eye').setAttribute('aria-label', 'Mostrar la contrasenya'); };
</script>
